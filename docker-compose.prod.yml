# Produção: PostgreSQL + API + front + Caddy (TLS). Nenhuma porta além de 80 e 443 é exposta.
#
#   cp .env.prod.example .env.prod   # preencha DOMAIN, POSTGRES_PASSWORD e JWT_SECRET
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# NEXT_PUBLIC_API_URL é gravada no build do front: se o DOMAIN mudar, rode o comando acima de novo.
# Atrás do Caddy, TRUST_PROXY=1 faz os limites por IP valerem para o cliente e não para o proxy.
name: garcom-nfc-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garcom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: garcom
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garcom -d garcom"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./back-end
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://garcom:${POSTGRES_PASSWORD}@db:5432/garcom?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET com 32+ caracteres (openssl rand -hex 32)}
      FRONTEND_URL: https://${DOMAIN:?defina DOMAIN}
      PUBLIC_APP_URL: https://${DOMAIN}
      TRUST_PROXY: 1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata_prod:
  caddy_data:
