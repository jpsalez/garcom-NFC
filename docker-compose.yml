# Único compose do projeto: PostgreSQL + API + front-end (desenvolvimento) e, opcionalmente, o banco dos testes.
# Sem Dockerfile: usa a imagem oficial do Node. Rode na RAIZ do projeto (esta pasta).
#
#   docker compose up                   # banco + API (http://localhost:4000, docs em /docs) + front (http://localhost:3000) + painel (http://localhost:8765)
#   docker compose up -d                # em segundo plano;  docker compose logs -f api web
#   docker compose down                 # para (mantém o banco);  down -v apaga banco e node_modules dos contêineres
#   (em back-end/) npm run test:db:up   # sobe SÓ o banco de testes (porta 5433); npm test; npm run test:db:down
#
# Funciona logo após o clone, sem configurar nada: o JWT_SECRET abaixo é só de DESENVOLVIMENTO.
# Para outro segredo ou outras portas, crie um .env aqui na raiz (JWT_SECRET=..., API_PORT, WEB_PORT...).
# back-end/.env (opcional) também é lido pela API, mas JWT_SECRET, banco e FRONTEND_URL vêm daqui.
# back-end/ é montado SOMENTE LEITURA: editar um arquivo de src/ reinicia a API sozinha.
name: garcom-nfc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garcom}
      POSTGRES_DB: ${POSTGRES_DB:-garcom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só a sua máquina enxerga o banco (DBeaver/psql). Em produção, remova esta porta.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: node:22-bookworm # versão completa: já traz o OpenSSL que o Prisma precisa
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: back-end/.env
        required: false # num clone novo o arquivo não existe
    environment:
      NODE_ENV: development
      PORT: 4000
      # Use caracteres seguros em URL na senha do banco (evite @ : / ? #)
      DATABASE_URL: postgresql://${POSTGRES_USER:-garcom}:${POSTGRES_PASSWORD:-garcom}@db:5432/${POSTGRES_DB:-garcom}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-segredo-apenas-para-desenvolvimento-local-troque-em-producao}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./back-end:/app:ro
      - api_node_modules:/app/node_modules # dependências ficam no volume, não na sua pasta
      - api_generated:/app/generated # client do Prisma gerado para Linux
      - npm_cache:/root/.npm
    # Instala dependências só se o package-lock mudou, gera o client do Prisma,
    # aplica as migrations e sobe a API reiniciando a cada mudança em src/.
    command:
      - sh
      - -c
      - |
        set -e
        H=$$(md5sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lockhash 2>/dev/null)" != "$$H" ]; then
          npm ci
          echo "$$H" > node_modules/.lockhash
        fi
        npx prisma generate
        npx prisma migrate deploy
        exec npx --yes tsx watch src/main.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s # primeiro boot: npm ci + prisma generate + migrations

  # Painel de controle do projeto (agentes, git, arquivos, tarefas, decisões). Só a sua máquina enxerga: porta publicada em 127.0.0.1.
  # Dentro do contêiner o painel não acha o `claude` nem a sua sessão ao vivo; o resto (git, arquivos, tarefas, decisões) funciona.
  painel:
    image: python:3.13-alpine
    working_dir: /workspace
    restart: unless-stopped
    environment:
      # o git recusa repositórios de outro dono dentro do contêiner; o painel só lê
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${PAINEL_PORT:-8765}:8765"
    volumes:
      - .:/workspace # o painel grava em .claude/painel (tarefas, decisões, histórico)
    command: sh -c "apk add --no-cache git >/dev/null && exec python3 .claude/scripts/painel.py --host 0.0.0.0 --port 8765 --public-port $${PAINEL_PORT:-8765}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Banco DESCARTÁVEL dos testes (dados em memória). Só sobe com o perfil "test":
  # `npm run test:db:up`. Nunca é tocado por `docker compose up`.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garcom
      POSTGRES_PASSWORD: garcom
      POSTGRES_DB: garcom_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garcom -d garcom_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Front-end (Next.js) em modo dev. A URL da API é a que o NAVEGADOR enxerga (host), não a do contêiner.
  web:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started # não espera o healthcheck: o front sobe em paralelo com o npm ci da API
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./front-end:/app
      - web_node_modules:/app/node_modules # dependências ficam no volume, não na sua pasta
      - web_next:/app/.next
      - npm_cache:/root/.npm
    command: sh -c "npm ci && exec npm run dev -- --hostname 0.0.0.0"

volumes:
  pgdata:
  api_node_modules:
  api_generated:
  web_node_modules:
  web_next:
  npm_cache:
