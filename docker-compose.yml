# Desenvolvimento local. Rode na raiz: docker compose up -d --build
# API em /docs, front na porta 3000. O front usa o build standalone preparado na imagem.
# Banco de teste: cd back-end && npm run test:db:up
name: garcom-nfc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garcom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garcom}
      POSTGRES_DB: ${POSTGRES_DB:-garcom}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Só a sua máquina enxerga o banco (DBeaver/psql). Em produção, remova esta porta.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: node:22-bookworm # versão completa: já traz o OpenSSL que o Prisma precisa
    working_dir: /app
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: back-end/.env
        required: false # num clone novo o arquivo não existe
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--max-old-space-size=256"
      MALLOC_ARENA_MAX: "2"
      API_WATCH: ${API_WATCH:-0}
      PORT: 4000
      MEDIA_ROOT: /data/media
      # Use caracteres seguros em URL na senha do banco (evite @ : / ? #)
      DATABASE_URL: postgresql://${POSTGRES_USER:-garcom}:${POSTGRES_PASSWORD:-garcom}@db:5432/${POSTGRES_DB:-garcom}?schema=public&connection_limit=5
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-segredo-apenas-para-desenvolvimento-local-troque-em-producao}
      SMTP_URL: ${SMTP_URL:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./back-end:/app
      - api_node_modules:/app/node_modules # dependências ficam no volume, não na sua pasta
      - api_generated:/app/generated # client do Prisma gerado para Linux
      - media_data:/data/media
      - npm_cache:/root/.npm
    # Instala dependências quando o lockfile muda e aplica migrations antes de iniciar.
    command:
      - sh
      - -c
      - |
        set -e
        H=$$(md5sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lockhash 2>/dev/null)" != "$$H" ]; then
          npm ci
          echo "$$H" > node_modules/.lockhash
        fi
        ./node_modules/.bin/prisma generate
        ./node_modules/.bin/prisma migrate deploy
        if [ "$$API_WATCH" = "1" ]; then
          exec node --watch --import tsx src/main.ts
        fi
        exec node --import tsx src/main.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s # primeiro boot: npm ci + prisma generate + migrations

  # Caixa de entrada de desenvolvimento: guarda os e-mails da API (link de redefinição de senha) sem enviá-los
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # Banco DESCARTÁVEL dos testes (dados em memória). Só sobe com o perfil "test":
  # `npm run test:db:up`. Nunca é tocado por `docker compose up`.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    mem_limit: 256m
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=25
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: garcom
      POSTGRES_PASSWORD: garcom
      POSTGRES_DB: garcom_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garcom -d garcom_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./front-end
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-4000}/api/v1}
    restart: unless-stopped
    mem_limit: 256m
    environment:
      NODE_OPTIONS: "--max-old-space-size=200"
      MALLOC_ARENA_MAX: "2"
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  api_node_modules:
  api_generated:
  npm_cache:
  media_data:
